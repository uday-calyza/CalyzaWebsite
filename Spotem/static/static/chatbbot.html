<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"
        media="print" onload="this.media='all'">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f6fa 0%, #e9e6ff 100%);
            min-height: 100vh;
        }

        /* Floating Button */
        .chat-button {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .chat-button:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 32px rgba(124, 58, 237, 0.4);
        }

        .chat-button svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        /* Chat Widget Container (responsive) */
        .chat-widget {
            position: fixed;
            bottom: 104px;
            right: 24px;
            width: min(92vw, 360px);
            height: min(82vh, 470px);
            background: white;
            border-radius: 32px;
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.18);
            border: 1.5px solid #e0e0e0;
            overflow: hidden;
            display: none;
            flex-direction: column;
            z-index: 999;
            animation: slideUp 0.3s ease-out;
        }

        .chat-widget.active {
            display: flex;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Dark Mode Styles */
        body.dark-mode {
            background: linear-gradient(135deg, #232136 0%, #3b3663 100%);
        }

        .dark-mode .chat-widget {
            background: rgba(34, 34, 54, 0.95);
            border: 1.5px solid #7c3aed;
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.28);
        }

        /* Header */
        .chat-header {
            background: linear-gradient(90deg, #7c3aed 0%, #a78bfa 100%);
            color: white;
            padding: 22px 20px 16px;
            text-align: center;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 1.5px;
            position: relative;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.08);
        }

        .dark-mode .chat-header {
            background: linear-gradient(90deg, #232136 0%, #7c3aed 100%);
        }

        .theme-toggle {
            position: absolute;
            right: 18px;
            top: 22px;
            background: none;
            border: none;
            cursor: pointer;
            color: #ede9fe;
            transition: transform 0.2s;
        }

        .theme-toggle:hover {
            transform: rotate(12deg);
        }

        .theme-toggle svg {
            width: 22px;
            height: 22px;
        }

        /* Welcome Screen */
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .welcome-body {
            flex: 1;
            padding: 20px 20px;
            background: linear-gradient(120deg, #f8f9fb 60%, #ede9fe 100%);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
        }

        .dark-mode .welcome-body {
            background: linear-gradient(120deg, #232136 60%, #3b3663 100%);
        }

        .bot-message {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 18px 18px 8px 18px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 2px 12px rgba(124, 58, 237, 0.07);
            font-size: 1.05rem;
            color: #3b3663;
            border-left: 4px solid #a78bfa;
        }

        .dark-mode .bot-message {
            background: rgba(34, 34, 54, 0.95);
            color: #ede9fe;
            border-left: 4px solid #7c3aed;
            box-shadow: 0 2px 12px rgba(124, 58, 237, 0.18);
        }

        .bot-message.secondary {
            margin-bottom: 28px;
            border-left: 4px solid #7c3aed;
        }

        .dark-mode .bot-message.secondary {
            border-left: 4px solid #a78bfa;
        }



        .avatars {
            display: flex;
            justify-content: space-between;
            margin: 22px 0 14px;
            gap: 10px;
        }

        .avatar {
            display: flex;
            align-items: center;
            font-size: 1.05rem;
            color: #7c3aed;
            background: rgba(167, 139, 250, 0.12);
            padding: 7px 16px 7px 10px;
            border-radius: 16px;
            font-weight: 500;
            box-shadow: 0 1px 4px rgba(124, 58, 237, 0.04);
        }

        .dark-mode .avatar {
            color: #a78bfa;
            background: rgba(124, 58, 237, 0.12);
        }

        .continue-btn {
            margin: 0 20px 22px;
            width: calc(100% - 40px);
            background: linear-gradient(90deg, #7c3aed 0%, #a78bfa 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px 0;
            font-size: 1.12rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.10);
            letter-spacing: 0.5px;
        }

        .continue-btn:hover {
            background: linear-gradient(90deg, #5b21b6 0%, #a78bfa 100%);
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.13);
        }

        .continue-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .dark-mode .continue-btn {
            background: linear-gradient(90deg, #232136 0%, #7c3aed 100%);
        }

        .dark-mode .continue-btn:hover {
            background: linear-gradient(90deg, #3b3663 0%, #a78bfa 100%);
        }

        /* Chat Screen */
        .chat-screen {
            flex: 1;
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .chat-screen.active {
            display: flex;
        }

        .simple-header {
            background: white;
            color: #333;
            padding: 18px 0 12px;
            text-align: center;
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 1px;
            border-bottom: 1px solid #f0f0f0;
            position: relative;
        }

        .dark-mode .simple-header {
            background: #232136;
            color: #ede9fe;
            border-bottom: 1px solid #3b3663;
        }

        .simple-header .theme-toggle {
            color: #7c3aed;
        }

        .simple-header .theme-toggle:hover {
            transform: rotate(12deg);
        }

        .dark-mode .simple-header .theme-toggle {
            color: #ede9fe;
        }

        .messages {
            flex: 1;
            padding: 18px 12px;
            overflow-y: auto;
            background: #f8f9fb;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }

        .dark-mode .messages {
            background: #232136;
        }

        .message {
            max-width: 80%;
            margin-bottom: 12px;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 1rem;
            word-break: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: #7c3aed;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.04);
        }

        .dark-mode .message.bot {
            background: #3b3663;
            color: #ede9fe;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.1);
        }

        .input-panel {
            display: flex;
            padding: 12px;
            background: white;
            border-top: 1px solid #f0f0f0;
            gap: 8px;
        }

        .dark-mode .input-panel {
            background: #3b3663;
            border-top: 1px solid #7c3aed;
        }

        .input-panel input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
            outline: none;
        }

        .dark-mode .input-panel input {
            background: #232136;
            color: #ede9fe;
            border: 1px solid #7c3aed;
        }

        .dark-mode .input-panel input::placeholder {
            color: #a78bfa;
        }

        .send-btn {
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #5b21b6;
        }

        .dark-mode .send-btn {
            background: #a78bfa;
        }

        .dark-mode .send-btn:hover {
            background: #7c3aed;
        }

        .hidden {
            display: none;
        }

        /* Typing indicator */
        .typing-indicator {
            align-self: flex-start;
            background: #fff;
            padding: 12px 16px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.04);
            display: none;
            margin-bottom: 12px;
        }

        .typing-indicator.visible {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #a78bfa;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        .dark-mode .typing-indicator {
            background: #3b3663;
        }

        .dark-mode .typing-indicator span {
            background: #7c3aed;
        }

        /* Responsive tweaks */
        @media (max-width: 1024px) {
            .chat-widget {
                bottom: 96px;
                right: 20px;
            }
        }

        @media (max-width: 768px) {
            .chat-widget {
                width: 92vw;
                height: 80vh;
                bottom: 88px;
                right: 16px;
                border-radius: 24px;
            }

            .welcome-body {
                padding: 16px 16px;
            }

            .chat-button {
                bottom: 16px;
                right: 16px;
            }

            .chat-header {
                font-size: 1.1rem;
                padding: 18px 16px 12px;
            }

            .continue-btn {
                width: calc(100% - 32px);
                margin: 0 16px 18px;
            }
        }

        @media (max-width: 420px) {

            /* Go fullscreen on very small devices */
            .chat-widget {
                width: 100vw;
                height: 100vh;
                right: 0;
                bottom: 0;
                border-radius: 0;
                border-left: 0;
                border-right: 0;
            }

            .chat-header {
                font-size: 1.05rem;
            }

            .messages {
                padding: 14px 10px;
            }
        }
    </style>
</head>

<body>
    <!-- Floating Chat Button -->
    <button class="chat-button" id="chatButton">
        <svg id="buttonIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </button>

    <!-- Chat Widget -->
    <div class="chat-widget" id="chatWidget">
        <!-- Welcome Screen -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="chat-header">
                Spotem Ai
                <button class="theme-toggle" id="themeToggle">
                    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>

            <div class="welcome-body">
                <div class="bot-message">
                    <span>👋 Hi, I'm Spotem Ai BOT— your smart cloud assistant!<br>
                        Welcome to the future of conversations! 🚀</span>
                </div>
                <div class="bot-message secondary">
                    Powered by advanced AI, I'm here to be your intelligent companion—ready to answer, assist, and
                    inspire.
                </div>


            </div>

            <button class="continue-btn" id="continueBtn">Continue</button>
        </div>

        <!-- Chat Screen -->
        <div class="chat-screen" id="chatScreen">
            <div class="simple-header">
                Spotem Ai
                <button class="theme-toggle" id="themeToggle2"
                    style="position: absolute; right: 18px; top: 18px; background: none; border: none; cursor: pointer; color: #7c3aed; transition: transform 0.2s;">
                    <svg id="themeIcon2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="width: 22px; height: 22px;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>

            <div class="messages" id="messages">
                <div class="message bot">👋 Hi! How can I help you today?</div>
                <div class="typing-indicator" id="typingIndicator">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <form class="input-panel" id="chatForm">
                <input type="text" id="userInput" placeholder="Type your message..." required />
                <button type="submit" class="send-btn">Send</button>
            </form>
        </div>
    </div>

    <script>
        // Elements
        const chatButton = document.getElementById('chatButton');
        const chatWidget = document.getElementById('chatWidget');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const chatScreen = document.getElementById('chatScreen');

        const continueBtn = document.getElementById('continueBtn');
        const themeToggle = document.getElementById('themeToggle');
        const themeToggle2 = document.getElementById('themeToggle2');
        const themeIcon = document.getElementById('themeIcon');
        const themeIcon2 = document.getElementById('themeIcon2');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const messages = document.getElementById('messages');
        const buttonIcon = document.getElementById('buttonIcon');
        const typingIndicator = document.getElementById('typingIndicator');

        let isOpen = false;

        // Toggle chat widget
        chatButton.addEventListener('click', function () {
            isOpen = !isOpen;
            chatWidget.classList.toggle('active');

            // Change button icon
            if (isOpen) {
                buttonIcon.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>';
            } else {
                buttonIcon.innerHTML = '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>';
            }
        });



        // Switch to chat screen
        continueBtn.addEventListener('click', function () {
            welcomeScreen.style.display = 'none';
            chatScreen.classList.add('active');
        });

        // Theme toggle
        const sunIcon = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
        const moonIcon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';

        function applyTheme() {
            const isDark = localStorage.getItem('theme') === 'dark';
            document.body.classList.toggle('dark-mode', isDark);
            themeIcon.innerHTML = isDark ? moonIcon : sunIcon;
            if (themeIcon2) {
                themeIcon2.innerHTML = isDark ? moonIcon : sunIcon;
            }
        }

        function toggleTheme() {
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
            applyTheme();
        }

        themeToggle.addEventListener('click', toggleTheme);
        if (themeToggle2) {
            themeToggle2.addEventListener('click', toggleTheme);
        }

        // Apply theme on load
        applyTheme();

        // Chat functionality
        chatForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            const sendBtn = chatForm.querySelector('.send-btn');

            addMessage(text, 'user');
            userInput.value = '';

            // Disable form while processing
            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';
            userInput.disabled = true;

            // Show typing indicator
            typingIndicator.classList.add('visible');
            messages.scrollTop = messages.scrollHeight;

            // Call backend /chat
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                typingIndicator.classList.remove('visible');
                addMessage(data.reply, 'bot');
            } catch (err) {
                console.error('Chat error:', err);
                typingIndicator.classList.remove('visible');
                addMessage("⚠️ Sorry, I encountered an error. Please try again.", 'bot');
            } finally {
                // Re-enable form
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send';
                userInput.disabled = false;
                userInput.focus();
            }
        });

        // Message rendering function
        function addMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = 'message ' + sender;
            msg.textContent = text;
            messages.insertBefore(msg, typingIndicator);
            messages.scrollTop = messages.scrollHeight;
        }

        // Skip welcome screen when embedded via iframe
        document.addEventListener("DOMContentLoaded", function () {
            if (window.self !== window.top) {
                // Embedded in iframe → redirect to chat screen
                window.location.href = "/chatpage";
            }
        });
    </script>

</body>

</html>
