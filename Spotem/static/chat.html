<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotem AI Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" media="print"
        onload="this.media='all'">
    <style>
        /* Dark Mode Styles */
        body.dark-mode {
            background: #232136;
        }

        .dark-mode .phone-frame {
            background: #3b3663;
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.2);
            border: 1px solid #7c3aed;
        }

        .dark-mode .header {
            background: #232136;
            color: #ede9fe;
            border-bottom: 1px solid #3b3663;
        }

        .dark-mode .chat-panel {
            background: #232136;
        }

        .dark-mode .messages {
            background: #232136;
        }

        .dark-mode .message.user {
            background: #7c3aed;
            color: #ede9fe;
        }

        .dark-mode .message.bot {
            background: #3b3663;
            color: #ede9fe;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.1);
        }

        .dark-mode .input-panel {
            background: #3b3663;
            border-top: 1px solid #7c3aed;
        }

        .dark-mode .input-panel input {
            background: #232136;
            color: #ede9fe;
            border: 1px solid #7c3aed;
        }

        .dark-mode .input-panel input::placeholder {
            color: #a78bfa;
        }

        .dark-mode .input-panel button {
            background: #a78bfa;
        }

        .dark-mode .input-panel button:hover {
            background: #7c3aed;
        }

        /* Light Mode (Default) Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #fff;
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
        }

        .phone-frame {
            background: #fff;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #7c3aed 0%, #a78bfa 100%);
            color: white;
            padding: 16px 0;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .dark-mode .header {
            background: linear-gradient(90deg, #232136 0%, #7c3aed 100%);
            color: #ede9fe;
            border-bottom: none;
        }

        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
            background: #f8f9fb;
            overflow: hidden;
        }

        .dark-mode .chat-panel {
            background: #232136;
        }

        .messages {
            flex: 1;
            padding: 18px 12px 0 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .dark-mode .messages {
            background: #232136;
        }

        .message {
            max-width: 80%;
            margin-bottom: 12px;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 1rem;
            word-break: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: #7c3aed;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: #fff;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.04);
        }

        /* Typing indicator */
        .typing-indicator {
            align-self: flex-start;
            background: #fff;
            padding: 12px 16px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.04);
            display: none;
            margin-bottom: 12px;
        }

        .typing-indicator.visible {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #a78bfa;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        .dark-mode .typing-indicator {
            background: #3b3663;
        }

        .dark-mode .typing-indicator span {
            background: #7c3aed;
        }

        .input-panel {
            display: flex;
            padding: 12px;
            background: #fff;
            border-top: 1px solid #f0f0f0;
            flex-shrink: 0;
            gap: 8px;
        }

        .input-panel input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
            outline: none;
        }

        .input-panel button {
            background: #7c3aed;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .input-panel button:hover {
            background: #5b21b6;
        }
    </style>
</head>

<body>
    <div class="phone-frame">
        <div class="header">Calyza Tech</div>
        <div class="chat-panel">
            <div class="messages" id="messages">
                <div class="message bot">👋 Hi! How can I help you today?</div>
                <div class="typing-indicator" id="typingIndicator">
                    <span></span><span></span><span></span>
                </div>
            </div>
            <form class="input-panel" id="chatForm" autocomplete="off">
                <input type="text" id="userInput" placeholder="Type your message..." required />
                <button type="submit">Send</button>
            </form>
        </div>
    </div>
    <script>
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const messages = document.getElementById('messages');
        const typingIndicator = document.getElementById('typingIndicator');

        // Apply theme on page load by checking localStorage
        function applyTheme() {
            const isDarkMode = localStorage.getItem('theme') === 'dark';
            document.body.classList.toggle('dark-mode', isDarkMode);
        }

        document.addEventListener('DOMContentLoaded', applyTheme);

        function showTyping() {
            typingIndicator.classList.add('visible');
            messages.scrollTop = messages.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.classList.remove('visible');
        }

        // Submit with backend call
        chatForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            const submitBtn = chatForm.querySelector('button');

            addMessage(text, 'user');
            userInput.value = '';
            submitBtn.disabled = true;
            userInput.disabled = true;

            showTyping();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) throw new Error('Server error');

                const data = await response.json();
                hideTyping();
                addMessage(data.reply, 'bot');
            } catch (err) {
                hideTyping();
                addMessage("⚠️ Sorry, something went wrong. Please try again.", 'bot');
            } finally {
                submitBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        });

        function addMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = 'message ' + sender;
            msg.textContent = text;
            // Insert before typing indicator
            messages.insertBefore(msg, typingIndicator);
            messages.scrollTop = messages.scrollHeight;
        }

    </script>

</body>

</html>
