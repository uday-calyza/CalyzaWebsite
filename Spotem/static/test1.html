<!-- Chatbot Integration -->

<div id="calyza-chatbot-wrapper">

    <!-- Floating Chat Button -->

    <button id="chatBtn" aria-label="Open Chatbot" class="chat-btn">

        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" width="28" height="28">

            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>

        </svg>

    </button>

    <!-- Chatbot Overlay -->

    <div class="overlay" id="overlay">

        <div class="phone-frame" role="dialog" aria-modal="true" aria-label="CalyzaBOT">

            <button class="close-btn" id="closeBtn" aria-label="Close chatbot">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" width="24" height="24">

                    <line x1="18" y1="6" x2="6" y2="18"></line>

                    <line x1="6" y1="6" x2="18" y2="18"></line>

                </svg>

            </button>

            <iframe class="bot-frame" id="botFrame" title="CalyzaBOT" src="https://chatbot.3character.in/"
                allow="clipboard-write; microphone;">

            </iframe>

        </div>

    </div>

</div>

<!-- Styles -->

<style>
    /* Floating Chat Button */

    .chat-btn {

        position: fixed;

        bottom: 24px;

        right: 24px;

        width: 64px;

        height: 64px;

        border-radius: 50%;

        background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 100%);

        border: none;

        cursor: pointer;

        display: flex;

        align-items: center;

        justify-content: center;

        box-shadow: 0 8px 24px rgba(124, 58, 237, 0.3);

        transition: all 0.3s ease;

        z-index: 10000;

    }

    /* Overlay container */

    .overlay {

        display: none;

        position: fixed;

        bottom: 100px;
        /* 👈 distance above chat button */

        right: 24px;

        z-index: 9999;

    }

    /* Chatbot frame */

    .phone-frame {

        width: 360px;

        height: 610px;

        border-radius: 32px;

        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);

        overflow: hidden;

        background: #fff;

        position: relative;

    }

    /* Close button */

    .close-btn {

        position: absolute;

        top: 12px;

        right: 12px;

        background: none;

        border: none;

        cursor: pointer;

        z-index: 10;

    }

    /* Iframe */

    .bot-frame {

        width: 100%;

        height: 100%;

        border: none;

        border-radius: 32px;

    }

    /* Responsive tweak for mobile */

    @media (max-width: 480px) {

        .overlay {

            bottom: 90px;

            right: 12px;

            width: 90%;

        }

        .phone-frame {

            width: 100%;

            height: 580px;

            border-radius: 24px;

        }

    }

    /* Hide default UP button if present */

    .button-back-to-top {

        display: none !important;

    }
</style>

<!-- Script -->

<script>

    document.addEventListener("DOMContentLoaded", function () {

        const overlay = document.getElementById("overlay");

        const chatBtn = document.getElementById("chatBtn");

        const closeBtn = document.getElementById("closeBtn");

        // Toggle overlay on chat button click

        chatBtn.addEventListener("click", () => {

            if (overlay.style.display === "block") {

                overlay.style.display = "none";

            } else {

                overlay.style.display = "block";

            }

        });

        // Close overlay on close button click

        closeBtn.addEventListener("click", () => {

            overlay.style.display = "none";

        });

    });

</script>
