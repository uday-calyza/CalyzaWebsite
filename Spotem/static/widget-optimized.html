<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Widget (Optimized)</title>
    <style>
        /* Floating Button - lightweight, no external fonts needed */
        .chat-button {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            z-index: 1000;
        }

        .chat-button:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 32px rgba(124, 58, 237, 0.4);
        }

        .chat-button svg {
            width: 28px;
            height: 28px;
            fill: #fff;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            display: none;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 24px;
            z-index: 999;
        }

        .overlay.active {
            display: flex;
        }

        .phone-frame {
            width: 350px;
            height: 610px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.18);
            border: 1.5px solid #e0e0e0;
            overflow: hidden;
            position: relative;
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.06);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .close-btn:hover {
            background: rgba(0, 0, 0, 0.12);
        }

        .close-btn svg {
            width: 18px;
            height: 18px;
            stroke: #4b5563;
        }

        .bot-frame {
            position: absolute;
            inset: 0;
            border: 0;
            width: 100%;
            height: 100%;
            background: #fff;
        }
    </style>
</head>

<body>

    <!-- Only the button loads initially - VERY lightweight -->
    <button class="chat-button" id="chatButton" aria-label="Open chatbot">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </button>

    <script>
        const chatButton = document.getElementById('chatButton');
        let overlayCreated = false;
        let overlay, botFrame;

        // LAZY LOAD: Only create the iframe when user clicks the button
        function createOverlay() {
            overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `
                <div class="phone-frame" role="dialog" aria-modal="true" aria-label="Spotem AI Bot">
                    <button class="close-btn" id="closeBtn" aria-label="Close chatbot">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                    <iframe
                        class="bot-frame"
                        id="botFrame"
                        title="Spotem AI Bot"
                        src="https://www.chatbot.calyzatech.com/"
                        loading="lazy"
                        allow="clipboard-write; microphone;">
                    </iframe>
                </div>
            `;
            document.body.appendChild(overlay);

            // Attach close handlers
            overlay.querySelector('#closeBtn').addEventListener('click', closeOverlay);
            overlay.addEventListener('click', function (e) {
                if (e.target === overlay) closeOverlay();
            });

            overlayCreated = true;
        }

        function openOverlay() {
            // Only load the chatbot iframe on FIRST click
            if (!overlayCreated) {
                createOverlay();
            }
            overlay.classList.add('active');
        }

        function closeOverlay() {
            overlay.classList.remove('active');
        }

        chatButton.addEventListener('click', openOverlay);
    </script>
</body>

</html>
