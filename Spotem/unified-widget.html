<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calyza AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .widget-container {
            display: flex;
            height: 100vh;
            background: #fff;
        }

        /* Main content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header with controls */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: linear-gradient(90deg, #7c3aed 0%, #a78bfa 100%);
            color: white;
            flex-shrink: 0;
        }

        .header .title {
            font-weight: 700;
            font-size: 1rem;
        }

        .header .controls {
            display: flex;
            gap: 8px;
        }

        .header .controls button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header .controls button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* View content */
        .view {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .view.active {
            display: flex;
        }

        /* Voice view */
        .voice-view .avatar-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #f8f9fb 0%, #ede9fe 100%);
            position: relative;
            padding: 20px;
        }

        .avatar-image {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.3);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .avatar-image svg {
            width: 80px;
            height: 80px;
            color: white;
        }

        .avatar-image.speaking {
            animation: pulse-avatar 1.5s infinite;
        }

        @keyframes pulse-avatar {

            0%,
            100% {
                box-shadow: 0 8px 32px rgba(124, 58, 237, 0.3);
            }

            50% {
                box-shadow: 0 8px 48px rgba(124, 58, 237, 0.6), 0 0 0 12px rgba(124, 58, 237, 0.15);
            }
        }

        .voice-status {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 16px;
        }

        .voice-status.listening {
            color: #7c3aed;
            font-weight: 600;
        }

        .voice-status.speaking {
            color: #10b981;
            font-weight: 600;
        }

        .voice-status.error {
            color: #ef4444;
        }

        .talk-btn {
            padding: 14px 32px;
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.3);
            transition: all 0.2s;
        }

        .talk-btn:hover {
            transform: scale(1.03);
        }

        .talk-btn.recording {
            background: linear-gradient(135deg, #ef4444, #f87171);
            animation: pulse-btn 1.5s infinite;
        }

        @keyframes pulse-btn {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }

            50% {
                box-shadow: 0 0 0 12px rgba(239, 68, 68, 0);
            }
        }

        .voice-transcript {
            max-height: 120px;
            overflow-y: auto;
            padding: 12px 16px;
            background: white;
            border-top: 1px solid #eee;
            font-size: 0.85rem;
        }

        .voice-transcript .msg {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 8px;
        }

        .voice-transcript .msg.user {
            background: #ede9fe;
            color: #5b21b6;
        }

        .voice-transcript .msg.assistant {
            background: #f0fdf4;
            color: #166534;
        }

        /* Chat view */
        .chat-view .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f8f9fb;
            display: flex;
            flex-direction: column;
        }

        .message {
            max-width: 80%;
            margin-bottom: 10px;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.9rem;
            word-break: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: #7c3aed;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .typing {
            align-self: flex-start;
            background: white;
            padding: 10px 14px;
            border-radius: 14px;
            display: none;
        }

        .typing.visible {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #a78bfa;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing span:nth-child(1) {
            animation-delay: 0s;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        .chat-input {
            display: flex;
            padding: 12px;
            background: white;
            border-top: 1px solid #eee;
            gap: 8px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid #d1d5db;
            font-size: 0.9rem;
            outline: none;
        }

        .chat-input input:focus {
            border-color: #7c3aed;
        }

        .chat-input button {
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 18px;
            font-weight: 600;
            cursor: pointer;
        }

        .chat-input button:hover {
            background: #5b21b6;
        }

        /* Sidebar tabs */
        .sidebar {
            width: 48px;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 8px;
            flex-shrink: 0;
            border-left: 1px solid #eee;
        }

        .tab-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: rgba(124, 58, 237, 0.1);
        }

        .tab-btn.active {
            background: #7c3aed;
            color: white;
        }

        .tab-btn svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>

<body>
    <div class="widget-container">
        <div class="main-content">
            <div class="header">
                <div class="title">Calyza AI</div>
                <div class="controls">
                    <button id="closeBtn" title="Close">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="3" stroke-linecap="round">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Voice View -->
            <div class="view voice-view active" id="voiceView">
                <div class="avatar-area">
                    <div class="avatar-image" id="avatarImage">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="8" r="4" />
                            <path d="M20 21a8 8 0 0 0-16 0" />
                        </svg>
                    </div>
                    <div class="voice-status" id="voiceStatus">Tap to start conversation</div>
                    <button class="talk-btn" id="talkBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                            <line x1="12" y1="19" x2="12" y2="23" />
                            <line x1="8" y1="23" x2="16" y2="23" />
                        </svg>
                        <span id="talkBtnText">Start talking</span>
                    </button>
                </div>
                <div class="voice-transcript" id="voiceTranscript">
                    <div class="msg assistant">Hi! I'm Calyza AI. Click "Start talking" and ask me anything about
                        CalyzaTech.</div>
                </div>
            </div>

            <!-- Chat View -->
            <div class="view chat-view" id="chatView">
                <div class="messages" id="chatMessages">
                    <div class="message bot">👋 Hi! How can I help you today?</div>
                    <div class="typing" id="chatTyping"><span></span><span></span><span></span></div>
                </div>
                <form class="chat-input" id="chatForm">
                    <input type="text" id="chatInput" placeholder="Type your message..." autocomplete="off" required />
                    <button type="submit">Send</button>
                </form>
            </div>
        </div>

        <div class="sidebar">
            <button class="tab-btn active" data-view="voice" title="Voice">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                    <line x1="12" y1="19" x2="12" y2="23" />
                    <line x1="8" y1="23" x2="16" y2="23" />
                </svg>
            </button>
            <button class="tab-btn" data-view="chat" title="Chat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        // Tab switching
        const tabs = document.querySelectorAll('.tab-btn');
        const views = document.querySelectorAll('.view');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const viewName = tab.dataset.view;
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                views.forEach(v => v.classList.remove('active'));
                document.getElementById(viewName + 'View').classList.add('active');
            });
        });

        // Close button — notify parent iframe
        document.getElementById('closeBtn').addEventListener('click', () => {
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'close-widget' }, '*');
            }
        });

        // ========== CHAT BOT ==========
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const chatMessages = document.getElementById('chatMessages');
        const chatTyping = document.getElementById('chatTyping');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;

            addChatMessage(text, 'user');
            chatInput.value = '';
            const btn = chatForm.querySelector('button');
            btn.disabled = true;
            chatTyping.classList.add('visible');
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const r = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await r.json();
                chatTyping.classList.remove('visible');
                addChatMessage(data.reply, 'bot');
            } catch (err) {
                chatTyping.classList.remove('visible');
                addChatMessage("⚠️ Sorry, something went wrong.", 'bot');
            } finally {
                btn.disabled = false;
                chatInput.focus();
            }
        });

        function addChatMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = 'message ' + sender;
            msg.textContent = text;
            chatMessages.insertBefore(msg, chatTyping);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ========== VOICE BOT ==========
        const talkBtn = document.getElementById('talkBtn');
        const talkBtnText = document.getElementById('talkBtnText');
        const voiceStatus = document.getElementById('voiceStatus');
        const voiceTranscript = document.getElementById('voiceTranscript');
        const avatarImage = document.getElementById('avatarImage');

        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let isRecording = false;
        let playbackQueue = [];
        let isPlaying = false;
        let playCtx = null;
        let nextPlayTime = 0;

        const wsHost = window.location.hostname;
        const wsUrl = `wss://${wsHost}:8444/`;

        talkBtn.addEventListener('click', async () => {
            if (!isRecording) {
                await startVoiceSession();
            } else {
                stopVoiceSession();
            }
        });

        async function startVoiceSession() {
            try {
                setVoiceStatus('Connecting...', '');

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    setVoiceStatus('Microphone requires HTTPS', 'error');
                    return;
                }

                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
                });

                audioContext = new AudioContext({ sampleRate: 16000 });
                const source = audioContext.createMediaStreamSource(mediaStream);
                processor = audioContext.createScriptProcessor(4096, 1, 1);
                source.connect(processor);
                processor.connect(audioContext.destination);

                ws = new WebSocket(wsUrl);
                ws.onmessage = (event) => handleVoiceMessage(JSON.parse(event.data));
                ws.onerror = () => { setVoiceStatus('Connection error', 'error'); stopVoiceSession(); };
                ws.onclose = () => { if (isRecording) stopVoiceSession(); };

                ws.addEventListener('message', function onReady(e) {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'ready') {
                        ws.removeEventListener('message', onReady);
                        startRecording();
                    }
                });
            } catch (err) {
                console.error(err);
                setVoiceStatus(err.name === 'NotAllowedError' ? 'Mic permission denied' : 'Error: ' + err.message, 'error');
            }
        }

        function startRecording() {
            isRecording = true;
            talkBtn.classList.add('recording');
            talkBtnText.textContent = 'Stop talking';
            setVoiceStatus('Listening...', 'listening');
            avatarImage.classList.add('speaking');

            processor.onaudioprocess = (e) => {
                if (!isRecording || !ws || ws.readyState !== WebSocket.OPEN) return;
                const inputData = e.inputBuffer.getChannelData(0);
                const pcm16 = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    const s = Math.max(-1, Math.min(1, inputData[i]));
                    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                ws.send(JSON.stringify({ type: 'audio', data: arrayBufferToBase64(pcm16.buffer) }));
            };
        }

        function stopVoiceSession() {
            isRecording = false;
            talkBtn.classList.remove('recording');
            talkBtnText.textContent = 'Start talking';
            setVoiceStatus('Tap to start conversation', '');
            avatarImage.classList.remove('speaking');

            if (processor) { processor.onaudioprocess = null; processor.disconnect(); processor = null; }
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
            if (audioContext) { audioContext.close(); audioContext = null; }
            if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify({ type: 'stop' })); ws.close(); }
            ws = null;
            playbackQueue = [];
            isPlaying = false;
            if (playCtx && playCtx.state !== 'closed') { playCtx.close(); playCtx = null; }
            nextPlayTime = 0;
        }

        function handleVoiceMessage(msg) {
            switch (msg.type) {
                case 'audio':
                    playbackQueue.push(msg.data);
                    if (!isPlaying) playNextAudio();
                    setVoiceStatus('Speaking...', 'speaking');
                    break;
                case 'transcript':
                    addVoiceTranscript(msg.text, msg.role);
                    break;
                case 'interrupted':
                    playbackQueue = [];
                    isPlaying = false;
                    setVoiceStatus('Listening...', 'listening');
                    break;
                case 'done':
                    setVoiceStatus('Listening...', 'listening');
                    break;
            }
        }

        async function playNextAudio() {
            if (playbackQueue.length === 0) {
                isPlaying = false;
                if (isRecording) setVoiceStatus('Listening...', 'listening');
                return;
            }
            isPlaying = true;
            if (!playCtx || playCtx.state === 'closed') {
                playCtx = new AudioContext({ sampleRate: 24000 });
                nextPlayTime = playCtx.currentTime;
            }
            while (playbackQueue.length > 0) {
                const bytes = base64ToArrayBuffer(playbackQueue.shift());
                try {
                    const int16 = new Int16Array(bytes);
                    const float32 = new Float32Array(int16.length);
                    for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;
                    const buffer = playCtx.createBuffer(1, float32.length, 24000);
                    buffer.getChannelData(0).set(float32);
                    const source = playCtx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(playCtx.destination);
                    const startAt = Math.max(nextPlayTime, playCtx.currentTime);
                    source.start(startAt);
                    nextPlayTime = startAt + buffer.duration;
                } catch (e) { console.error(e); }
            }
            setTimeout(playNextAudio, 100);
        }

        function addVoiceTranscript(text, role) {
            const msg = document.createElement('div');
            msg.className = 'msg ' + role;
            msg.textContent = text;
            voiceTranscript.appendChild(msg);
            voiceTranscript.scrollTop = voiceTranscript.scrollHeight;
        }

        function setVoiceStatus(text, cls) {
            voiceStatus.textContent = text;
            voiceStatus.className = 'voice-status' + (cls ? ' ' + cls : '');
        }

        function arrayBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let bin = '';
            for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin);
        }
        function base64ToArrayBuffer(base64) {
            const bin = atob(base64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes.buffer;
        }
    </script>
</body>

</html>
